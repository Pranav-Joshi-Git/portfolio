<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Prevent flash of wrong theme before React hydrates -->
    <script>
      (function () {
        var stored = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', stored || (prefersDark ? 'dark' : 'light'));
      })();
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#F5C518" />

    <!-- Primary SEO -->
    <title>Pranav Joshi — AEM &amp; Edge Delivery Services Developer</title>
    <meta name="description" content="Pranav Joshi is an AEM and Edge Delivery Services Developer and Associate Consultant at Infosys. 4+ years across AEM Sites, Adaptive Forms, DAM, and Edge Delivery Services. Based in Pune, India." />
    <meta name="keywords" content="Pranav Joshi, AEM Developer, Adobe Experience Manager, Edge Delivery Services, AEM Developer Pune, Infosys AEM, Pranav Joshi Developer, Pranav Joshi AEM" />
    <meta name="author" content="Pranav Joshi" />
